<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="bg-gray-50 text-gray-500 font-body transition-colors duration-200 dark:bg-gray-900 dark:text-gray-300">
    <div class="grid md:grid-cols-3"> <!--content wrapper-->

        <div class="md:col-span-1 md:flex md:justify-end">
            <nav class="w-full md:text-right">
                <div class="flex justify-between items-start md:block">
                <h1 class="font-black uppercase p-4 border-gray-100 text-2xl font-body dark:border-gray-800 dark:text-gray-100">
                     <a href="/" class="hover:text-gray-700 dark:hover:text-gray-50">Food Ninja</a></h1>

                <ul class="hidden flex-col md:block" id="menu">
                    <li class="text-gray-700 font-bold py-1 m-1.5 dark:text-gray-200"> 
                        <a href="#" class="flex w-28 ml-auto items-center gap-2 text-left">
                            <img class="inline-block w-4" src="img/home.png" alt="home">
                            <span>Home</span>
                        </a>
                    </li>

                    <li class="text-gray-700 font-bold py-1 m-1.5 dark:text-gray-200"> 
                        <a href="#" class="flex w-28 ml-auto items-center gap-2 text-left">
                            <img class="inline-block w-4" src="img/about.png" alt="about">
                            <span>About</span>
                        </a>
                    </li>

                    <li class="text-gray-700 font-bold py-1 m-1.5 dark:text-gray-200"> 
                        <a href="#" class="flex w-28 ml-auto items-center gap-2 text-left">
                            <img class="inline-block w-4" src="img/contact-mail.png" alt="contact">
                            <span>Contact</span>
                        </a>
                    </li>
                </ul>

                     <button type="button" class="flex h-14 w-14 shrink-0 cursor-pointer items-center justify-center p-0 md:hidden" id="burger">
                        <img class="block h-6 w-6 object-contain" src="img/menu.png" alt="menu">
                     </button>
                </div>
            </nav> 
        </div> <!--end nav-->

        <main class="px-4 md:px-8 py-6 bg-gray-100 md:col-span-2 dark:bg-gray-800">
            <div class="flex justify-center md:justify-end gap-2 items-center">
                <button id="theme-toggle" type="button" class="theme-toggle button border-red-400 border-2 hover:bg-red-400 hover:text-white transition ease-out duration-500" aria-label="Switch to dark mode" title="Toggle theme"></button>
                <a href="#" class="button ml-2 border-red-400 border-2 hover:bg-red-400 hover:text-white transition ease-out duration-500">Sign Up</a>
                <a href="#" class="button border-red-400 border-2 hover:bg-red-400 hover:text-white transition ease-out duration-500">Log in</a>
            </div>

            <header>
                <h2 class="text-gray-700 text-4xl font-semibold dark:text-gray-100">Recipes</h2>
                <h3 class="text-2xl font-semibold dark:text-gray-200">For Ninjas</h3>
            </header>

            <div>
                <h4 class="font-bold mt-12 pb-2 border-b border-gray-200 dark:border-gray-700 dark:text-gray-100"> Latest Recipes</h4>

                <div class="mt-8 grid grid-cols-1 lg:grid-cols-3 gap-10"> 
                    <!--Cards sit here-->
                    <div class="card w-full hover:shadow-lg">
                        <div class="relative">
                            <img class="w-full" src="img/stew.jpg" alt="stew">
                            <div class="badge">
                                <svg class="w-3 inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" 
                                viewBox="0 0 24 24" 
                                strokeWidth={1.5} stroke="currentColor" className="size-6">
                                <path strokeLinecap="round" strokeLinejoin="round" 
                                d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                </svg>

                                <span>25 min</span>
                            </div>
                        </div>
                        <div class="m-4">
                            <span class="font-bold dark:text-gray-100"> 5 Bean Chilli Stew</span>
                            <span class="block text-gray-500 text-sm dark:text-gray-300">Recipe by Mario</span>
                        </div>
                        </div>
                   
                    <div class="card w-full hover:shadow-lg">

                        <div class="relative">
                            <img class="w-full" src="img/noodles.jpg" alt="noodles">
                            <div class="badge">
                                <svg class="w-3 inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" 
                                viewBox="0 0 24 24" 
                                strokeWidth={1.5} stroke="currentColor" className="size-6">
                                <path strokeLinecap="round" strokeLinejoin="round" 
                                d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                </svg>
                                <span>25 min</span>
                            </div>
                        </div>
                        <div class="m-4">
                            <span class="font-bold dark:text-gray-100"> Veg Noodles</span>
                            <span class="block text-gray-500 text-sm dark:text-gray-300">Recipe by Mario</span>
                        </div>
                        </div>

                    <div class="card w-full hover:shadow-lg">

                        <div class="relative">
                            <img class="w-full" src="img/curry.jpg" alt="stew">
                            <div class="badge">
                                <svg class="w-3 inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" 
                                viewBox="0 0 24 24" 
                                strokeWidth={1.5} stroke="currentColor" className="size-6">
                                <path strokeLinecap="round" strokeLinejoin="round" 
                                d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                </svg>
                                <span>25 min</span>
                            </div>
                        </div>
                        <div class="m-4">
                            <span class="font-bold dark:text-gray-100">Tofu Curry </span>
                            <span class="block text-gray-500 text-sm dark:text-gray-300">Recipe by Mario</span>
                        </div>
                        </div>
                        </div>

                        <h4 class="font-bold mt-12 pb-2 border-b border-gray-200 dark:border-gray-700 dark:text-gray-100"> Most Popular</h4>
                        <div class="mt-8"> <!--Cards sit here-->
 
                        </div>
 
                        <div class="flex justify-center">
                            <button type="button" class="button button-primary hover:shadow-inner transform hover:scale-125 hover:bg-opacity-50 transition ease-out duration-500">Load More</button>
                        </div>

                </div>

            </div>

        </main>

    </div>
    
</body>
<script src="index.js"></script>
</html>
